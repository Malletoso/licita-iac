<title>Licita IAC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de autos no topo; trilha de passos à esquerda; formulário ao centro; parecer do motor à direita */
:root {
  --paper: #f4f7f7; --surface: #ffffff; --sunk: #eaf0f0; --ink: #14242a; --muted: #56686f; --line: #d3dde0;
  --accent: #0d6466; --accent-ink: #ffffff; --accent-soft: #dcefee;
  --ok: #1e7a45; --ok-soft: #e1f3e7; --warn: #8a5a00; --warn-soft: #fbefd3; --bad: #b0281f; --bad-soft: #fbe3e0;
  --mark: #fff0a3; --mark-ink: #3b3000; --shadow: 0 1px 2px rgba(20,36,42,.06), 0 6px 18px rgba(20,36,42,.06);
  --f-display: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1517; --surface: #152024; --sunk: #1b282c; --ink: #e1eaec; --muted: #93a6ac; --line: #2b3b40;
  --accent: #52b8b0; --accent-ink: #062120; --accent-soft: #173537;
  --ok: #63c98a; --ok-soft: #173326; --warn: #e6b04a; --warn-soft: #362a10; --bad: #f07a6f; --bad-soft: #3a1a17;
  --mark: #5c4d0e; --mark-ink: #fff3c2; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e1517; --surface: #152024; --sunk: #1b282c; --ink: #e1eaec; --muted: #93a6ac; --line: #2b3b40;
  --accent: #52b8b0; --accent-ink: #062120; --accent-soft: #173537;
  --ok: #63c98a; --ok-soft: #173326; --warn: #e6b04a; --warn-soft: #362a10; --bad: #f07a6f; --bad-soft: #3a1a17;
  --mark: #5c4d0e; --mark-ink: #fff3c2; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto }
.brand b { font: 600 20px/1 var(--f-display); letter-spacing: -.01em }
.brand small { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
.autos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0 }
.autos label { font: 500 11px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.autos select { max-width: 280px; min-width: 0 }
.sync { font: 500 11px/1 var(--f-mono); color: var(--muted); padding: 4px 8px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap }
.sync.on { color: var(--ok); border-color: var(--ok) }

/* grade principal */
.wrap { display: grid; grid-template-columns: 210px minmax(0, 1fr) 330px; gap: 24px; max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px }
nav.passos { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: flex; flex-direction: column; gap: 2px }
nav.passos button { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--muted) }
nav.passos button .n { font: 500 12px/1 var(--f-mono); color: var(--muted) }
nav.passos button:hover { background: var(--sunk); color: var(--ink) }
nav.passos button[aria-current="step"] { background: var(--accent-soft); color: var(--ink); font-weight: 600 }
nav.passos button[aria-current="step"] .n { color: var(--accent) }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line) }
.dot.ok { background: var(--ok) } .dot.alerta { background: var(--warn) } .dot.bloq { background: var(--bad) }

main { min-width: 0; display: flex; flex-direction: column; gap: 18px }
.head-passo { display: flex; flex-direction: column; gap: 4px }
.head-passo .eyebrow { font: 500 11px/1 var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .08em }
.head-passo h1 { font: 600 28px/1.15 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
.head-passo p { margin: 0; color: var(--muted); max-width: 68ch }
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.bloco > h2 { font: 600 15px/1.3 var(--f-body); margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.span2 { grid-column: span 2 }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field > label { font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap }
.req { color: var(--bad); font-weight: 600 }
.art { font: 500 11px/1 var(--f-mono); color: var(--accent); background: var(--accent-soft); padding: 3px 6px; border-radius: 4px; white-space: nowrap }
.hint { margin: 0; font-size: 12.5px; color: var(--muted) }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0 }
textarea { resize: vertical; line-height: 1.5 }
input:hover, select:hover, textarea:hover { border-color: var(--muted) }
input[type=number] { font-variant-numeric: tabular-nums }
.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px }
.chk input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none }
.chk .art { margin-left: 6px }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px }
legend { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px }
.sub { padding-left: 26px; display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--accent-soft); margin-left: 7px }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--accent); color: var(--accent) }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink) }
.btn.ghost { border-color: transparent; background: none; color: var(--muted) }
.btn.ghost:hover { color: var(--bad) }
.btn.small { padding: 4px 8px; font-size: 12.5px }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.nav-passo { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }

.tabwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums }
table.t th { text-align: left; font: 500 11px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--sunk); padding: 8px; white-space: nowrap }
table.t td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top }
table.t td input, table.t td select, table.t td textarea { padding: 6px 8px; font-size: 13.5px }
table.t td.num { text-align: right; white-space: nowrap }
table.t tr.excl td { color: var(--muted) }
table.t tr.excl td input:not([type=checkbox]) { text-decoration: line-through }

.item { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--surface) }
.item-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.item-h .idx { font: 600 12px/1 var(--f-mono); color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 4px }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.stats b { color: var(--ink); font-weight: 600 }
.dev { font: 500 12px var(--f-mono) }
.dev.hi { color: var(--bad) }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px/1 var(--f-mono); padding: 4px 8px; border-radius: 99px; white-space: nowrap }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.alerta { background: var(--warn-soft); color: var(--warn) }
.pill.bloq { background: var(--bad-soft); color: var(--bad) } .pill.info { background: var(--accent-soft); color: var(--accent) }
.hip { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; background: var(--surface) }
.hip.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.hip.bloq { background: var(--sunk) }
.hip input { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 3px }
.hip .tt { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
.hip .tt b { font-weight: 600 }
.hip ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px }
.hip ul.req li::marker { content: "◻ " }
.grupo-t { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 6px }

/* trilha direita: parecer do motor */
aside.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 92px); overflow: auto; padding-bottom: 8px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow) }
.card h3 { margin: 0; font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.valor { font: 600 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.enq b { font-size: 15px; display: block; line-height: 1.3 }
.enq .base { font: 500 12px var(--f-mono); color: var(--accent) }
.barra { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden }
.barra i { display: block; height: 100% }
.alertas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px }
.alertas li { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: start }
.alertas li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--accent) }
.alertas li.alerta::before { background: var(--warn) } .alertas li.bloq::before { background: var(--bad) }
.pecas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 13px }
.pecas li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line) }
.pecas li:first-child { border-top: 0 }
.pecas .sg { font: 500 11px var(--f-mono); color: var(--muted); margin-right: 6px }
.pend { font: 500 11px var(--f-mono); color: var(--warn); white-space: nowrap }
.pend.zero { color: var(--ok) }

.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.banner b { color: var(--warn) }

/* documentos */
.doc-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line) }
.doc-row:first-child { border-top: 0 }
.doc-row .sg { font: 600 12px/1 var(--f-mono); color: var(--accent); background: var(--accent-soft); padding: 8px 0; text-align: center; border-radius: 6px }
.doc-row .tt b { display: block; font-weight: 600 }
.doc-row .tt span { font-size: 12.5px; color: var(--muted) }

/* pré-visualização */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(10,20,24,.55); display: flex; justify-content: center; padding: calc(env(safe-area-inset-top,0px) + 16px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px, env(safe-area-inset-left,0px)) }
.folha-wrap { width: min(820px, 100%); display: flex; flex-direction: column; gap: 10px; min-height: 0 }
.folha-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: #fff }
.folha-bar b { font-weight: 600 }
.folha { background: #fff; color: #1a1a1a; overflow: auto; border-radius: 6px; padding: 48px 56px; font: 14px/1.55 Arial, "Helvetica Neue", sans-serif; flex: 1; min-height: 0 }
.folha .cab { text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 18px }
.folha .cab b { display: block; letter-spacing: .02em }
.folha .cab small { color: #555 }
.folha h4 { text-align: center; margin: 0; font-size: 16px }
.folha .subt { text-align: center; font-style: italic; color: #555; font-size: 12.5px; margin: 2px 0 16px }
.folha h5 { font-size: 14px; margin: 16px 0 6px }
.folha p { margin: 0 0 8px; text-align: justify }
.folha p.r { text-align: right }
.folha p.nt { font-style: italic; color: #555; font-size: 12.5px; text-align: left }
.folha p.li { padding-left: 28px }
.folha table { border-collapse: collapse; width: 100%; margin: 6px 0 12px; font-size: 12.5px }
.folha th, .folha td { border: 1px solid #9aa; padding: 4px 6px; text-align: left; vertical-align: top }
.folha th { background: #e4ecee }
.folha .tw { overflow-x: auto }
.folha .sig { text-align: center; margin: 34px 0 10px }
.folha .sig span { display: block; border-top: 1px solid #333; width: 280px; max-width: 100%; margin: 0 auto 4px }
.folha mark { background: #fff0a3; color: #3b3000; padding: 0 2px }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
.confirma { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; background: var(--bad-soft); padding: 8px 10px; border-radius: 6px }

@media (max-width: 1180px) {
  .wrap { grid-template-columns: 190px minmax(0, 1fr) }
  aside.rail { grid-column: 2; position: static; max-height: none; overflow: visible }
}
@media (max-width: 780px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px }
  aside.rail { grid-column: 1 }
  nav.passos { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px }
  nav.passos button { grid-template-columns: auto auto; white-space: nowrap }
  nav.passos button .dot { display: none }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr) }
  .span2 { grid-column: auto }
  .head-passo h1 { font-size: 23px }
  .folha { padding: 24px 18px }
  .doc-row { grid-template-columns: 46px minmax(0, 1fr) }
  .doc-row .btns { grid-column: 1 / -1 }
  .autos select { max-width: 100% }
}
@media (prefers-reduced-motion: no-preference) { .btn, nav.passos button { transition: background .12s, color .12s, border-color .12s } }
</style>

<header class="top">
  <div class="brand"><b>Licita IAC</b><small>Lei 14.133/2021</small></div>
  <div class="autos" id="autos"></div>
</header>
<div class="wrap">
  <nav class="passos" id="passos" aria-label="Etapas do processo"></nav>
  <main id="main"></main>
  <aside class="rail" id="rail" aria-label="Análise do processo"></aside>
</div>
<div id="modal" hidden></div>
<input type="file" id="arqImport" accept=".json,application/json" hidden>
<input type="file" id="arqBrasao" accept="image/png,image/jpeg" hidden>
<div class="toast" id="toast" hidden></div>
